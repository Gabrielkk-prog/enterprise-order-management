<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Order Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<header>
    <h1>Enterprise Order Management</h1>
    <p>Sistema de gerenciamento de pedidos</p>
</header>

<main>
    <section class="card">
        <h2>Criar cliente</h2>
        <form id="customerForm">
            <input type="text" id="customerName" placeholder="Nome" required>
            <input type="email" id="customerEmail" placeholder="E-mail" required>
            <input type="text" id="customerDocument" placeholder="Documento" required>
            <button type="submit">Criar cliente</button>
        </form>
        <div id="customerResult"></div>
    </section>

    <section class="card">
        <h2>Criar produto</h2>
        <form id="productForm">
            <input type="text" id="productName" placeholder="Nome do produto" required>
            <input type="text" id="productDescription" placeholder="Descrição">
            <input type="number" id="productPrice" placeholder="Preço" step="0.01" min="0.01" required>
            <button type="submit">Criar produto</button>
        </form>
        <div id="productResult"></div>
    </section>

    <section class="card">
        <h2>Buscar cliente</h2>
        <form id="searchCustomerForm">
            <input type="number" id="customerId" placeholder="ID do cliente" required>
            <button type="submit">Buscar</button>
        </form>
        <div id="searchCustomerResult"></div>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
