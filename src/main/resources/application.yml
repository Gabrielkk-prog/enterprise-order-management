spring:
  application:
    name: ${SPRING_APPLICATION_NAME:enterprise-order-management}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/enterprise_orders}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true

server:
  port: 8080
